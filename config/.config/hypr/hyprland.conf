# --- Environment & Autostart ---
exec-once = qs -c noctalia-shell
exec-once = hypridle
exec-once = hyprlock
exec-once = hyprcursor
exec-once = hyprctl setcursor Moga-Black 10

# --- Monitors ---
monitor = ,preferred,auto,1

# --- Variables ---
$mainMod = SUPER
$terminal = kitty
$fileManager = kitty spf ~/
$ipc = qs -c noctalia-shell ipc call
$menu = fuzzel
$browser = firefox

# --- Input ---
input {
    kb_layout = us
    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        scroll_factor = 0.8
	    }

    sensitivity = 0.2
}

# --- General Look ---
general {
   gaps_in = 5
   gaps_out = 5
   border_size = 2
   layout = dwindle 
}

# --- Decoration ---
decoration {
    rounding = 12
    dim_inactive = true
    dim_strength = 0.2
    
    blur {
        enabled = true
        size = 6
        passes = 3
    }
}

# --- Animations ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- Layouts ---
dwindle {
    preserve_split = true
}

# --- Misc ---
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# --- Keybindings ---

# 1. APPLICATIONS
bind = $mainMod, W, exec, $terminal #"Terminal"
bind = $mainMod, B, exec, $browser #"Browser"
bind = $mainMod, E, exec, $fileManager #"File Manager"
bind = $mainMod, R, exec, $menu #"App Launcher"
bind = $mainMod, V, exec, $ipc launcher clipboard #"Clipboard"
bind = $mainMod, H, exec, $ipc plugin:keybind-cheatsheet toggle #"Keybinds List"

# 2. WINDOW MANAGEMENT
bind = $mainMod, Q, killactive, #"Close window"
bind = $mainMod, F, togglefloating, #"Toggle floating"
bind = $mainMod, L, fullscreen #"Toggle fullscreen"
bind = $mainMod, G, togglegroup, #"Toggle group"
bind = $mainMod, TAB, changegroupactive, f #"Change group active"
bind = $mainMod, left, movefocus, l #"Focus left"
bind = $mainMod, right, movefocus, r #"Focus right"
bind = $mainMod, up, movefocus, u #"Focus up"
bind = $mainMod, down, movefocus, d #"Focus down"
bindm = $mainMod, mouse:272, movewindow #"Move window"
bindm = $mainMod, mouse:273, resizewindow #"Resize window"

# 3. WORKSPACES
bind = $mainMod, 1, workspace, 1 #"Workspace 1"
bind = $mainMod, 2, workspace, 2 #"Workspace 2"
bind = $mainMod, 3, workspace, 3 #"Workspace 3"
bind = $mainMod, 4, workspace, 4 #"Workspace 4"
bind = $mainMod, 5, workspace, 5 #"Workspace 5"
bind = $mainMod, 6, workspace, 6 #"Workspace 6"
bind = $mainMod, 7, workspace, 7 #"Workspace 7"
bind = $mainMod, 8, workspace, 8 #"Workspace 8"
bind = $mainMod, 9, workspace, 9 #"Workspace 9"
bind = $mainMod, 0, workspace, 10 #"Workspace 10"
bind = $mainMod SHIFT, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #"Move to workspace 5"
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #"Move to workspace 6"
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #"Move to workspace 7"
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #"Move to workspace 8"
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #"Move to workspace 9"
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #"Move to workspace 10"

# 4. SPECIAL WORKPLACE
bind = $mainMod, S, togglespecialworkspace, magic #"Toggle special workspace"
bind = $mainMod SHIFT, S, movetoworkspace, special:magic #"Move to special workspace"

# 5. SYSTEM
bind = $mainMod, L, exec, loginctl lock-session #"Lock session"
bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase #"Volume Up"
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease #"Volume Down"
bindl = , XF86AudioMute, exec, $ipc volume muteOutput #"Mute Audio"
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase #"Brightness Up"
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease #"Brightness Down"
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png #"Screenshot"

# --- Gestures ---
gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 150  
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 5  
}

# --- Theming ---
